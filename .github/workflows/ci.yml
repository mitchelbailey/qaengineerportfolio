# Yarra & Co. CI
#
# Pipeline shape:
#
#   quality ──▶ playwright (3 shards) ──▶ report ──▶ publish-report (Pages)
#                    │
#                    └────────────────▶ deploy (main only) ──▶ smoke (live URL)
#
# Two things are load-bearing and worth reading before editing:
#
# 1. Every job that runs Playwright pins the SAME container image. Visual
#    baselines are pixel comparisons, and font rendering differs between the
#    GitHub runner image and this container — and between successive versions
#    of the runner image. Pinning means a baseline generated by
#    `visual-baselines.yml` stays valid until someone deliberately changes the
#    pin. If you bump @playwright/test, bump the image tag in BOTH workflows.
#
# 2. The suite reports `blob` under CI (see playwright.config.ts), which is not
#    human-readable on its own. Each shard uploads its blob; the `report` job
#    merges them into a single HTML report covering the whole run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Run all four even if an earlier one fails: one push that fixes every
      # reported problem beats four round trips through CI.
      - name: ESLint
        run: npm run lint

      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Vitest
        if: ${{ !cancelled() }}
        run: npm run test:unit

  playwright:
    name: Playwright (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: quality
    runs-on: ubuntu-latest
    # Keep in sync with visual-baselines.yml and @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      # uid 1001 is the user GitHub's runner owns the workspace as. Without it
      # the container runs as root, and root-owned files in the workspace break
      # artefact upload. This is the pairing Playwright's own CI docs use.
      options: --user 1001
    strategy:
      # A failure in shard 2 says nothing about shard 3. Run them all and get
      # the full picture from one CI run.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No `playwright install` step: the pinned image already ships the exact
      # browser builds this @playwright/test version expects.
      - name: Run Playwright suite
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        # Must run on failure — a failing shard is precisely the one whose
        # report someone needs to read.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 14

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          # Traces, videos, and the actual/expected/diff PNGs from any failed
          # visual comparison.
          path: test-results
          retention-days: 14

  report:
    name: Merge HTML report
    needs: playwright
    # `always()`: the report matters most when the suite went red.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14

      # Only the main-branch report gets published, so the public URL always
      # reflects the state of main rather than whatever PR ran last.
      - name: Package the report for GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

  publish-report:
    name: Publish report to GitHub Pages
    needs: report
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    name: Deploy Worker to Cloudflare
    needs: [quality, playwright]
    # Deploy only what has passed, and only from main. Deliberately keyed on
    # "not a pull request" rather than "is a push": a run started by hand from
    # the Actions tab has to be able to deploy too. See the note on
    # GITHUB_TOKEN in visual-baselines.yml for why that matters.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEMO_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # @cloudflare/vite-plugin emits the built Worker plus a generated
      # wrangler.json into dist/yarra_co/. That generated config — not the one
      # in the repo root — is what knows where the built client assets live.
      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/yarra_co/wrangler.json

  smoke:
    name: Smoke test the live deployment
    needs: deploy
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # BASE_URL makes playwright.config.ts skip its local webServer entirely,
      # so this exercises the deployed Worker rather than a fresh local build of
      # the same commit. The test-support endpoints are session-scoped, so
      # seeding data here cannot affect anyone else browsing the demo.
      - name: Smoke tests against ${{ vars.DEMO_URL }}
        run: npx playwright test --project=chromium --grep @smoke
        env:
          BASE_URL: ${{ vars.DEMO_URL }}

      - name: Upload smoke failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results
          retention-days: 14
