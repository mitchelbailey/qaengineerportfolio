# Generate the Linux visual baselines.
#
# Why this exists at all: `toHaveScreenshot` resolves baselines per platform,
# so the `-win32.png` files committed from a Windows dev machine are invisible
# to a Linux CI run — it looks for `-linux.png`, finds nothing, and fails. The
# two sets cannot be shared, because Linux and Windows rasterise the same font
# at the same size differently enough to blow past any sane pixel threshold.
#
# So the baselines have to be *generated* on the same image CI compares them
# on. That is this workflow. Run it manually, review the diff it pushes, and
# from then on `ci.yml` has real baselines to compare against.
#
# Run it again whenever:
#   - the UI changes on purpose and CI reports the resulting visual diffs
#   - the container image pin in ci.yml changes
#
# Reviewing the commit is not optional. `--update-snapshots` will happily bless
# a genuine regression as the new truth, which is the one way a visual suite
# can quietly stop testing anything.
#
# The commit this pushes does NOT start a CI run. GitHub refuses to trigger
# workflows from pushes authenticated with the default GITHUB_TOKEN, as a
# recursion guard. So after this workflow succeeds, start CI by hand from the
# Actions tab — which is why ci.yml's deploy and publish jobs are gated on
# "not a pull request" rather than "is a push", so a manual run still deploys.
name: Update Linux visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Regenerate and commit
    runs-on: ubuntu-latest
    # MUST match the image in ci.yml — a baseline generated on a different
    # image is worse than no baseline, because it fails for reasons that have
    # nothing to do with the application.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Regenerate visual baselines
        # Expected to be non-zero on the first run: a test whose baseline was
        # missing or rewritten is reported as failed even though the file was
        # written. The commit step below is the real check.
        continue-on-error: true
        run: npx playwright test --project=visual --update-snapshots

      - name: Show what changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short

      - name: Commit the baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tests/**/*-linux.png"
          if git diff --staged --quiet; then
            echo "No baseline changes — nothing to commit."
            exit 0
          fi
          git commit -m "Update Linux visual baselines" -m "Generated by .github/workflows/visual-baselines.yml on mcr.microsoft.com/playwright:v1.62.0-noble."
          git push origin HEAD:${{ github.ref_name }}

      # Uploaded regardless, so the screenshots can be eyeballed in the run
      # summary without pulling the branch.
      - name: Upload baselines for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: tests/visual/**/*-linux.png
          retention-days: 14
          if-no-files-found: error
